# Builds the salon frontend (website + /admin dashboard) and backend images on
# GitHub's runners and pushes them to GHCR. Coolify then only pulls and runs the
# finished images, so the 2-core VPS never runs a heavy build (which overloaded it).
name: Build salon images

on:
  push:
    branches: [main]
    paths:
      - 'salon-app/**'
      - 'website/**'
      - 'salon-backend/**'
      - 'Dockerfile'
      - 'Dockerfile.web'
      - 'deploy/**'
      - '.github/workflows/salon-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: salon-images
  cancel-in-progress: true

env:
  # Public site URL (SEO/sitemap for the website). Update when a custom domain is added.
  NEXT_PUBLIC_SITE_URL: http://lnwrd6pusii00hvssezmwnws.187.53.143.234.sslip.io
  # Empty = the dashboard calls /api on its own domain (nginx proxies to the backend).
  VITE_API_URL: ''

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/higleemy-gif/salon-frontend:latest
            ghcr.io/higleemy-gif/salon-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/higleemy-gif/salon-backend:latest
            ghcr.io/higleemy-gif/salon-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
